[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bumpem"
version = "0.1.0"
description = "Server, board API and simulator for the Bump'em perturbation system"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]   # websockets: uvicorn needs it for /api/v1/stream
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
bumpem = "bumpem.cli:main"

[tool.setuptools.packages.find]
include = ["bumpem*"]
