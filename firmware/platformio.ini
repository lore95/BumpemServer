; Teensy 4.1 firmware. Build: pio run   Upload: pio run -t upload   Monitor: pio device monitor
; v1 firmware, protocol in docs/PROTOCOL.md. v0 reference build: firmware/legacy/
[env:teensy41]
platform = teensy@6.0.0
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MCP4728@1.0.10
    adafruit/Adafruit BusIO@1.17.4
